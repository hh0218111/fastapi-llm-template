# 应用项目（非库）：不构建/安装自身，uv run 直接跑 app/ 下的代码
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
